<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayToDay - Inicio de Sesión</title>
    <link rel="stylesheet" href="css\inicio_sesion.css">
</head>
<body>

    <div class="contenedor-centrado">
        <article class="tarjeta-inicio-sesion">
            <header>
                <p class="titulo-logo">Day<span>To</span>Day</p>
                <h3 class="subtitulo">Inicio de Sesión</h3>
            </header>

            <div class="grupo-formulario">
                <label for="correo">Correo Electrónico</label>
                <input class="campo-correo" type="email" id="correo" placeholder="ejemplo111@mail.com" required>
            </div>

            <div class="grupo-formulario">
                <label for="contrasena">Contraseña</label>
                <input class="campo-contrasena" type="password" id="contrasena" placeholder="Ingresá tu contraseña" required>
            </div>

            <!-- Botón transformado en enlace que redirige a la pantalla de inicio -->
            <a href="principio.html" class="boton-iniciar-sesion">Iniciar Sesión</a>

            <p class="textito">¿No tenés una cuenta? 
                <a class="link-registrar" href="registro.html">Registrarse</a>
            </p>
        </article>
    </div>

</body>
</html>
