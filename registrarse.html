<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>DayToDay - Registrarse</title>
        <link rel="stylesheet" href="est_registrarse.css">
    </head>
    <body>
        <p class="titulo">Day<span class="to">To</span>Day</p>
        <article class="tarjeta-registro">
            <header>
                <h3 class="subtitulo">Registrarse</h3>
            </header>
            <div class="grupo-formulario">
                <label for="nombre">Nombre y Apellido</label>
                <input class="campo-nombre" id="nombre" type="text" placeholder="Ingresar" required>
            </div>
            <div class="grupo-formulario">
                <label for="campo-correo">Correo electronico</label>
                <input class="campo-correo" id="correo" type="email" placeholder="ejemplo111@mail.com" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña</label>
                <input class="campo-contrasena" id="contrasena" type="password" placeholder="Ingresa tu contraseña" required>
            </div>
                <button class="boton-registrarse" type="submit">Registrarse</button>
        </article>
        
    </body>
</html>
