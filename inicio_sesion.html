<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>DayToDay - Inicio de Sesión</title>
        <link rel="stylesheet" href="inicio_sesion.css">
    </head>
    <body>
        <p class="titulo">Day<span class="to">To</span>Day</p>
        <article class="tarjeta-inicio-sesion">
            <header>
                <p class="subtitulo">Inicio de Sesión</p>
            </header>
            <div class="grupo-formulario">
                <label for="correo">Correo Electrónico</label>
                <input class="campo-correo" type="email" id="correo" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña</label>
                <input class="campo-contrasena" type="password" id="contrasena" required>
            </div>
            <button class="boton-iniciar-sesion" type="submit">Iniciar Sesión</button>
        </article>
    </body>
</html>
